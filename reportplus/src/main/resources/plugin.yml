name: ReportPlusPlus
version: '${version}'
main: com.ludvig.reportplus.ReportPlusPlusPlugin
api-version: '1.21'
authors: [ludvig2457]
description: Reports with persistence, staff notifications and a GUI.
website: https://github.com/ludvig2457
commands:
  report:
    description: Report a player to the staff.
    usage: /report <player> <reason>
    permission: reportplus.report.use
  reports:
    description: Manage player reports.
    usage: /reports [list|gui|tp|close|info]
    aliases: [reportlist]
    permission: reportplus.report.staff
permissions:
  reportplus.report.use:
    description: Allows creating reports.
    default: true
  reportplus.report.notify:
    description: Receives new report notifications.
    default: op
  reportplus.report.staff:
    description: Allows viewing and handling reports.
    default: op
  reportplus.report.bypass:
    description: Bypasses report cooldown.
    default: op
