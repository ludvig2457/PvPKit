name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.16.5', '1.17.1', '1.18.2', '1.19.4', '1.20.6', '1.21.1', '1.21.4', '1.21.8', '1.21.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for ${{ matrix.mc }}
        run: ./gradlew clean build --no-daemon -PmcVersion=${{ matrix.mc }}-R0.1-SNAPSHOT

      - name: Collect jar
        run: |
          mkdir -p artifact
          VERSION=$(grep "^version = " build.gradle | cut -d"'" -f2)
          cp build/libs/*.jar "artifact/PvPKit-${VERSION}-mc${{ matrix.mc }}.jar"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: PvPKit-${{ matrix.mc }}
          path: artifact/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifact/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifact/*.jar --title "PvPKit $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
          fi
