name: PvPKit
version: '${version}'
main: com.ludvig.pvpkit.PvPKitPlugin
api-version: '1.21'
authors: [ludvig2457]
description: PvP HUD, KitPvP kits, combat modes, stats and reports for Paper.
website: https://github.com/ludvig2457
commands:
  hud:
    description: Toggle the PvP HUD.
    usage: /hud [on|off]
    permission: pvpplugin.hud
  kit:
    description: Open the kit menu or claim a kit.
    usage: /kit [list|preview|give|reset|reload|<name>]
    aliases: [kits]
    permission: pvpplugin.kit
  report:
    description: Report a player to the staff.
    usage: /report <player> <reason>
    permission: pvpplugin.report.use
  reports:
    description: Manage player reports.
    usage: /reports [list|gui|tp|close|info]
    aliases: [reportlist]
    permission: pvpplugin.report.staff
  pvpkit:
    description: PvPKit administration.
    usage: /pvpkit [reload]
    permission: pvpplugin.admin
  combat:
    description: View or change the combat system.
    usage: /combat [1.8.9|1.12|1.21.11|info]
    aliases: [combatsystem]
    permission: pvpplugin.combat
  stats:
    description: View PvP stats and leaderboard.
    usage: /stats [player|top|reset]
    aliases: [pvpstats]
    permission: pvpplugin.stats
  scoreboard:
    description: Toggle the PvP sidebar.
    usage: /scoreboard [on|off]
    aliases: [sb, sidebar]
    permission: pvpplugin.scoreboard
  settings:
    description: Open the player settings menu.
    usage: /settings
    aliases: [prefs]
    permission: pvpplugin.settings
  spawn:
    description: Teleport to spawn.
    usage: /spawn
    permission: pvpplugin.spawn
permissions:
  pvpplugin.hud:
    description: Allows toggling the PvP HUD.
    default: true
  pvpplugin.kit:
    description: Allows claiming kits.
    default: true
  pvpplugin.kit.bypass:
    description: Bypasses kit cooldowns and combat checks.
    default: op
  pvpplugin.kit.admin:
    description: Allows giving and resetting kits, and reloading.
    default: op
  pvpplugin.report.use:
    description: Allows creating reports.
    default: true
  pvpplugin.report.notify:
    description: Receives new report notifications.
    default: op
  pvpplugin.report.staff:
    description: Allows viewing and handling reports.
    default: op
  pvpplugin.report.bypass:
    description: Bypasses report cooldown.
    default: op
  pvpplugin.combat:
    description: Allows viewing the combat system.
    default: true
  pvpplugin.combat.admin:
    description: Allows changing the combat system.
    default: op
  pvpplugin.stats:
    description: Allows viewing stats.
    default: true
  pvpplugin.stats.admin:
    description: Allows resetting stats.
    default: op
  pvpplugin.scoreboard:
    description: Allows toggling the sidebar.
    default: true
  pvpplugin.settings:
    description: Allows opening the settings menu.
    default: true
  pvpplugin.spawn:
    description: Allows using /spawn.
    default: true
  pvpplugin.spawn.bypass:
    description: Bypasses the spawn cooldown.
    default: op
  pvpplugin.admin:
    description: Full plugin administration.
    default: op
