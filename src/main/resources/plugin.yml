name: PvPKit
version: '${version}'
main: com.ludvig.pvpkit.PvPKitPlugin
api-version: '1.21'
authors: [ludvig2457]
description: PvP combat modes, HUD, stats, sidebar, settings and spawn for Paper.
website: https://github.com/ludvig2457
commands:
  hud:
    description: Toggle the PvP HUD.
    usage: /hud [on|off]
    permission: pvpplugin.hud
  pvpkit:
    description: PvPKit administration.
    usage: /pvpkit [reload]
    permission: pvpplugin.admin
  combat:
    description: View or change the combat system.
    usage: /combat [1.8.9|1.12|1.21.11|info]
    aliases: [combatsystem]
    permission: pvpplugin.combat
  stats:
    description: View PvP stats and leaderboard.
    usage: /stats [player|top|reset]
    aliases: [pvpstats]
    permission: pvpplugin.stats
  scoreboard:
    description: Toggle the PvP sidebar.
    usage: /scoreboard [on|off]
    aliases: [sb, sidebar]
    permission: pvpplugin.scoreboard
  settings:
    description: Open the player settings menu.
    usage: /settings
    aliases: [prefs]
    permission: pvpplugin.settings
  spawn:
    description: Teleport to spawn.
    usage: /spawn
    permission: pvpplugin.spawn
permissions:
  pvpplugin.hud:
    description: Allows toggling the PvP HUD.
    default: true
  pvpplugin.combat:
    description: Allows viewing the combat system.
    default: true
  pvpplugin.combat.admin:
    description: Allows changing the combat system.
    default: op
  pvpplugin.stats:
    description: Allows viewing stats.
    default: true
  pvpplugin.stats.admin:
    description: Allows resetting stats.
    default: op
  pvpplugin.scoreboard:
    description: Allows toggling the sidebar.
    default: true
  pvpplugin.settings:
    description: Allows opening the settings menu.
    default: true
  pvpplugin.spawn:
    description: Allows using /spawn.
    default: true
  pvpplugin.spawn.bypass:
    description: Bypasses the spawn cooldown.
    default: op
  pvpplugin.admin:
    description: Full plugin administration.
    default: op
