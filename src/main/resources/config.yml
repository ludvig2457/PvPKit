settings:
  hud:
    # How often the action bar is refreshed (in ticks). 2 = 10 times per second.
    update-interval-ticks: 2
    # New players see the HUD by default. Toggle with /hud.
    default-enabled: true
    show-cps: true
    show-combo: true
    show-armor: true
    show-keys: true
    show-streak: true
    show-combat: true
    show-ping: true
  combat:
    # Available: 1.8.9, 1.12, 1.21.11
    mode: "1.21.11"
    # Combat tag duration after player-vs-player damage (seconds).
    tag-seconds: 15
    # Combo window (seconds).
    combo-seconds: 3
    # Authentic 1.8.9 mechanics. Other modes ignore this section.
    legacy:
      # 1.8 sword blocking: damage = damage * multiplier + flat.
      blocking-damage-multiplier: 0.5
      blocking-damage-flat: 0.5
      # Movement speed while blocking (1.8 uses 20%).
      blocking-speed-multiplier: 0.2
      # Knockback 1.8 values: normal, sprint hit, vertical.
      knockback-horizontal: 0.4
      knockback-sprint-horizontal: 0.9
      knockback-vertical: 0.4
  scoreboard:
    default-enabled: true
    update-interval-ticks: 20
  stats:
    kill-feed: true
    killstreak-announce: true
  spawn:
    cooldown-seconds: 10
    block-in-combat: true

