settings:
  hud:
    # How often the action bar is refreshed (in ticks). 2 = 10 times per second.
    update-interval-ticks: 2
    # New players see the HUD by default. Toggle with /hud.
    default-enabled: true
    show-cps: true
    show-combo: true
    show-armor: true
    show-keys: true
    show-streak: true
    show-combat: true
    show-ping: true
  scoreboard:
    default-enabled: true
    update-interval-ticks: 20
  stats:
    kill-feed: true
    killstreak-announce: true
