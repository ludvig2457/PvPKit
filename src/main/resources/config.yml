#       leggings: "DIAMOND_LEGGINGS PROTECTION:2"
#       boots: "DIAMOND_BOOTS PROTECTION:2"
#     offhand: "SHIELD"
#     items:
#       - "NETHERITE_SWORD SHARPNESS:3"
#       - "GOLDEN_APPLE:8"
#     effects:
#       - "SPEED:1:300"               # <effect>:<amplifier>:<duration-seconds>
